# Splunk scheduled alert — drop into $SPLUNK_HOME/etc/system/local/savedsearches.conf
# Fires when a single source produces >= 5 failed network logons (4625) in one minute.

[RDP Brute-Force Detected - 4625 Burst]
search = index=main sourcetype="WinEventLog:Security" EventCode=4625 (Logon_Type=3 OR Logon_Type=10) \
  | bucket _time span=1m \
  | stats count AS attempts by _time, Source_Network_Address, Account_Name \
  | where attempts >= 5
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
alert_comparator = greater than
alert_threshold = 0
action.email = 1
